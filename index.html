<style>
:root {
  --bg: #F1F4F3; --surface: #FFFFFF; --ink: #14201E; --muted: #566764; --line: #D5DDDA;
  --accent: #0E6B5C; --accent-ink: #FFFFFF; --good: #17803D; --bad: #B42318; --warn: #A15C07; --field: #F7F9F8;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1715; --surface: #17221F; --ink: #E6EFEC; --muted: #93A5A0; --line: #2A3935;
    --accent: #4FC3A8; --accent-ink: #08201A; --good: #3FBF73; --bad: #F2877C; --warn: #E0AB4A; --field: #1C2926; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { color-scheme: light dark; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: max(20px, env(safe-area-inset-top, 0px)); padding-bottom: max(56px, env(safe-area-inset-bottom, 0px)); }
[hidden] { display: none !important; }
main { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
main.narrow { max-width: 420px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: 1.7rem; letter-spacing: -0.01em; } h2 { font-size: 1.2rem; } h3 { font-size: 1rem; margin-top: 6px; }
.eyebrow { font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); } .small { font-size: 0.84rem; } .hint { font-size: 0.8rem; color: var(--muted); }
.pos { color: var(--good); } .neg { color: var(--bad); } .warn { color: var(--warn); }

.brand { display: flex; align-items: center; gap: 12px; }
.logo { width: 44px; height: 44px; border-radius: 50%; flex: none; display: block; }
.top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: flex-end; }
.who { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; min-width: 0; }
.lotbar { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; font-weight: 600; cursor: pointer; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 9px 14px; min-height: 40px; }
button:hover { border-color: var(--accent); }
button:disabled { opacity: 0.6; cursor: default; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.ghost { background: transparent; }
button.danger { color: var(--bad); }
button.danger.armed { background: var(--bad); color: #fff; border-color: var(--bad); }
button.mini, button.mini2 { min-height: 34px; padding: 5px 10px; font-size: 0.82rem; }
button.link { background: none; border: 0; padding: 0; min-height: 0; color: var(--accent); text-decoration: underline; font-weight: 600; text-align: left; }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input, select { font: inherit; color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 9px 10px; min-height: 42px; width: 100%; min-width: 0; }
input[type="number"] { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
.tab { white-space: nowrap; background: var(--surface); }
.tab.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.badge { display: inline-block; min-width: 1.3em; padding: 0 5px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 0.75rem; text-align: center; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.result { gap: 18px; }
.bigline { display: flex; flex-direction: column; gap: 2px; }
.big { font-family: var(--font-num); font-size: clamp(1.9rem, 8vw, 2.6rem); font-weight: 500; line-height: 1.1; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 16px; }
.pair2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.pair > div, .pair2 > div { min-width: 0; }
.stat { font-family: var(--font-num); font-size: 1.12rem; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label { font-size: 0.78rem; color: var(--muted); font-weight: 500; }
.field.wide { grid-column: 1 / -1; }
.msg { font-size: 0.9rem; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--field); }
.msg.bad { color: var(--bad); border-color: var(--bad); }

.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 0.88rem; }
th, td { padding: 9px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
td.txt { text-align: left; max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
th { font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: var(--field); }
td { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
td.emptycell { text-align: left; font-family: var(--font-body); color: var(--muted); white-space: normal; }
tr:last-child td { border-bottom: 0; }
tfoot td { font-weight: 600; background: var(--field); }

details.fold { padding: 0; gap: 0; }
details.fold > summary { cursor: pointer; padding: 16px 18px; font-weight: 600; font-family: var(--font-display); font-size: 1.05rem; list-style-position: inside; }
details.fold > form { padding: 0 18px 18px; }

.rows { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px; background: var(--field); border: 1px solid var(--line); border-radius: 8px; }
.row .rowtxt { flex: 1 1 160px; min-width: 0; overflow-wrap: anywhere; }
.row select { flex: 1 1 150px; width: auto; }

.agentcard { border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: var(--field); display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.agname { font-weight: 600; font-family: var(--font-display); font-size: 1.02rem; }
.mini-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 10px 12px; }
.mini-grid > div { min-width: 0; }
.mini-grid .stat { font-size: 0.98rem; }
@media (min-width: 640px) { .who { align-items: flex-end; } }

.toast { position: fixed; left: 50%; transform: translateX(-50%) translateY(20px); bottom: max(20px, env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; max-width: calc(100% - 32px); z-index: 50; font-size: 0.9rem; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.bad { background: var(--bad); color: #fff; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

  var nf = new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 0 });
  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function num(v) { var x = parseFloat(v); return isFinite(x) ? x : 0; }

  function agg(data, ids) {
    var set = {}; ids.forEach(function (id) { set[id] = 1; });

    data.shipments.forEach(function (s) { if (set[s.agent_id]) { r.shipped += num(s.qty); r.cost += num(s.qty) * num(s.unit_cost); } });

    r.avgCost = r.shipped > 0 ? r.cost / r.shipped : 0;
    r.remaining = r.shipped - r.sold;
    r.cogs = r.sold * r.avgCost;
    r.toRemit = r.revenue - r.remitted;

  function agentsOf(data, country) {
    return data.profiles.filter(function (p) { return p.role === "agent" && p.country === country; });

  function countryStats(data, country) {
    var agents = agentsOf(data, country);

      '<form class="panel" data-form="auth" novalidate>' +
      (login ? "" : '<div class="field"><label for="a-name">Ton nom</label><input id="a-name" name="name" type="text" autocomplete="name" value="' + esc(S.authName) + '" required></div>') +

  function renderPending() {
    return '<main class="narrow">' + header() + '<section class="panel"><h2>Compte en attente</h2><p class="muted" style="margin:0">Ton compte est créé. Le propriétaire doit maintenant le valider et t\'attribuer ton pays. Reviens dans un moment, la page se met à jour toute seule.</p></section></main>';
  }

  function delBtn(table, id, label) {
    var key = table + ":" + id, armed = S.armed === key;
    return '<button type="button" class="mini danger' + (armed ? " armed" : "") + '" data-act="del" data-table="' + table + '" data-id="' + esc(id) + '" aria-label="Supprimer ' + esc(label || "") + '">' + (armed ? "Confirmer" : "Retirer") + "</button>";
  }
  function tableWrap(head, body, foot, min) {
    return '<div class="tablewrap"><table style="min-width:' + (min === undefined ? 480 : min) + 'px"><thead><tr>' + head + "</tr></thead><tbody>" + body + "</tbody>" + (foot ? "<tfoot>" + foot + "</tfoot>" : "") + "</table></div>";
  }
  function mini(label, value, klass) { return '<div><div class="eyebrow">' + label + '</div><div class="stat ' + (klass || "") + '">' + value + "</div></div>"; }
  function emptyRow(cols, text) { return '<tr><td colspan="' + cols + '" class="emptycell">' + text + "</td></tr>"; }

  /* ----- vue agent ----- */
  function renderAgent() {
    var d = S.data || { shipments: [], sales: [], remittances: [] };
    var me = S.profile.id;
    var a = agg(d, [me]);
    a.avgCost = 0;
    var recent = d.sales.slice(0, 40);
    var now = Date.now();
    var rows = recent.map(function (s) {
      var canDel = now - new Date(s.created_at).getTime() < 86400000;
      return "<tr><td>" + dateFr(s.sale_date) + "</td><td>" + fmt(s.qty) + "</td><td>" + fmt(s.amount) + '</td><td class="txt">' + esc(s.place || "") + "</td><td>" + (canDel ? delBtn("sales", s.id, "cette vente") : "") + "</td></tr>";
    }).join("");
    var ship = d.shipments.slice(0, 15).map(function (s) { return "<tr><td>" + dateFr(s.ship_date) + "</td><td>" + fmt(s.qty) + "</td></tr>"; }).join("");
    var rem = d.remittances.slice(0, 15).map(function (s) { return "<tr><td>" + dateFr(s.paid_date) + "</td><td>" + fmt(s.amount) + "</td></tr>"; }).join("");
    return '<main>' + header() +
      '<section class="panel result"><div class="bigline"><span class="eyebrow">Sachets restants</span><span class="big ' + (a.remaining < 0 ? "neg" : "") + '">' + fmt(a.remaining) + '</span><span class="muted small">' + fmt(a.shipped) + " reçus · " + fmt(a.sold) + " vendus</span></div>" +
      '<div class="pair">' + statTile("Total à me verser", money(a.revenue), "Somme de tes ventes") + statTile("Déjà versé", money(a.remitted)) + statTile("Reste à verser", money(a.toRemit), "", a.toRemit > 0 ? "warn" : "pos") + "</div></section>" +
      '<section class="panel"><h2>Enregistrer une vente</h2><form data-form="sale" class="fields" novalidate>' +
      '<div class="field"><label for="s-date">Date</label><input id="s-date" name="date" type="date" value="' + today() + '" required></div>' +
      '<div class="field"><label for="s-qty">Sachets vendus</label><input id="s-qty" name="qty" type="number" inputmode="numeric" min="1" step="1" required></div>' +
      '<div class="field"><label for="s-amount">Montant à me verser (FCFA)</label><input id="s-amount" name="amount" type="number" inputmode="decimal" min="0" step="any" required></div>' +
      '<div class="field"><label for="s-place">Client et ville (facultatif)</label><input id="s-place" name="place" type="text" autocomplete="off"></div>' +
      '<div class="field wide"><button class="primary" type="submit"' + (S.busy ? " disabled" : "") + ">Enregistrer la vente</button></div></form></section>" +
      '<section class="panel"><h2>Mes dernières ventes</h2><div class="hint">Tu peux retirer une vente saisie par erreur pendant 24 heures.</div>' +
      tableWrap("<th>Jour</th><th>Sachets</th><th>Montant</th><th>Client</th><th></th>", rows || emptyRow(5, "Aucune vente pour le moment."), "", 440) + "</section>" +
      '<section class="panel"><h2>Stock reçu et sommes versées</h2><div class="pair2"><div>' +
      tableWrap("<th>Jour</th><th>Sachets reçus</th>", ship || emptyRow(2, "Aucun envoi."), "", 0) + "</div><div>" +
      tableWrap("<th>Jour</th><th>Versé (FCFA)</th>", rem || emptyRow(2, "Aucun versement."), "", 0) + "</div></div></section></main>";
  }

  /* ----- vue propriétaire ----- */
  function ownerTabs(d) {
    var present = COUNTRIES.filter(function (c) {
      return d.profiles.some(function (p) { return p.role === "agent" && p.country === c; }) || d.expenses.some(function (e) { return e.country === c; });
    });
    var pending = d.profiles.filter(function (p) { return p.role === "pending"; }).length;
    return { list: ["total"].concat(present, ["agents"]), pending: pending };
  }
  function tabBar(t) {
    return '<nav class="tabs" role="tablist" aria-label="Pays">' + t.list.map(function (k) {
      var label = k === "total" ? "Total" : k === "agents" ? "Agents" : k;
      var badge = k === "agents" && t.pending ? ' <span class="badge">' + t.pending + "</span>" : "";
      return '<button type="button" role="tab" aria-selected="' + (S.tab === k) + '" class="tab' + (S.tab === k ? " on" : "") + '" data-act="tab" data-tab="' + esc(k) + '">' + esc(label) + badge + "</button>";
    }).join("") + "</nav>";
  }

  function ownerTotal(d) {
    var present = ownerTabs(d).list.filter(function (k) { return k !== "total" && k !== "agents"; });
    var T = { shipped: 0, sold: 0, remaining: 0, revenue: 0, remitted: 0, toRemit: 0, expenses: 0, profit: 0 };
    var cards = present.map(function (c) {
      var st = countryStats(d, c).total;
      Object.keys(T).forEach(function (k) { T[k] += st[k]; });
      return '<div class="agentcard"><div class="agname"><button type="button" class="link" data-act="tab" data-tab="' + esc(c) + '">' + esc(c) + "</button></div><div class=\"mini-grid\">" +
        mini("Envoyés", fmt(st.shipped)) + mini("Vendus", fmt(st.sold)) + mini("Restants", fmt(st.remaining)) + mini("Ventes", fmt(st.revenue)) + mini("Versé", fmt(st.remitted)) + mini("À recevoir", fmt(st.toRemit), st.toRemit > 0 ? "warn" : "") + mini("Dépenses", fmt(st.expenses)) + mini("Bénéfice", fmt(st.profit), cls(st.profit)) + "</div></div>";
    }).join("");
    return '<section class="panel result"><div class="bigline"><span class="eyebrow">Bénéfice net, tous pays</span><span class="big ' + cls(T.profit) + '">' + money(T.profit) + '</span><span class="muted small">Ventes − coût des sachets vendus − dépenses de campagnes</span></div>' +
      '<div class="pair">' + statTile("Chiffre d\'affaires", money(T.revenue), fmt(T.sold) + " sachets vendus") + statTile("Reste à recevoir des agents", money(T.toRemit), "Déjà reçu : " + money(T.remitted), T.toRemit > 0 ? "warn" : "pos") + statTile("Stock chez les agents", fmt(T.remaining) + " sachets", fmt(T.shipped) + " envoyés") + statTile("Dépenses de campagnes", money(T.expenses)) + "</div></section>" +
      '<section class="panel"><h2>Par pays</h2><div class="hint">Montants en FCFA. Touche un pays pour voir le détail.</div>' +
      (cards ? '<div class="rows">' + cards + "</div>" : '<div class="muted small">Aucun agent validé pour le moment. Va dans l\'onglet Agents.</div>') + "</section>";
  }

  function agentOptions(agents) {
    return agents.map(function (a) { return '<option value="' + esc(a.id) + '">' + esc(a.name || a.email) + "</option>"; }).join("");
  }
  function ownerCountry(d, country) {
    var st = countryStats(d, country), t = st.total, agents = st.agents;
    var nameOf = {}; d.profiles.forEach(function (p) { nameOf[p.id] = p.name || p.email; });
    var ids = {}; agents.forEach(function (a) { ids[a.id] = 1; });

    var agentCards = st.rows.map(function (r) {
      return '<div class="agentcard"><div class="agname">' + esc(r.agent.name || r.agent.email) + '</div><div class="mini-grid">' +
        mini("Envoyés", fmt(r.shipped)) + mini("Vendus", fmt(r.sold)) + mini("Restants", fmt(r.remaining), r.remaining < 0 ? "neg" : "") + mini("Ventes", fmt(r.revenue)) + mini("Versé", fmt(r.remitted)) + mini("À recevoir", fmt(r.toRemit), r.toRemit > 0 ? "warn" : "") + "</div></div>";
    }).join("");

    var cSales = d.sales.filter(function (s) { return ids[s.agent_id]; });
    var byDay = {};
    cSales.forEach(function (s) { var k = s.sale_date; (byDay[k] = byDay[k] || { q: 0, a: 0 }); byDay[k].q += num(s.qty); byDay[k].a += num(s.amount); });
    var dayRows = Object.keys(byDay).sort().reverse().slice(0, 30).map(function (k) { return "<tr><td>" + dateFr(k) + "</td><td>" + fmt(byDay[k].q) + "</td><td>" + fmt(byDay[k].a) + "</td></tr>"; }).join("");

    var saleRows = cSales.slice(0, 25).map(function (s) {
      return "<tr><td>" + dateFr(s.sale_date) + '</td><td class="txt">' + esc(nameOf[s.agent_id] || "") + "</td><td>" + fmt(s.qty) + "</td><td>" + fmt(s.amount) + '</td><td class="txt">' + esc(s.place || "") + "</td><td>" + delBtn("sales", s.id, "cette vente") + "</td></tr>";
    }).join("");
    var cShip = d.shipments.filter(function (s) { return ids[s.agent_id]; }).slice(0, 20).map(function (s) {
      return "<tr><td>" + dateFr(s.ship_date) + '</td><td class="txt">' + esc(nameOf[s.agent_id] || "") + "</td><td>" + fmt(s.qty) + "</td><td>" + fmt(s.unit_cost) + "</td><td>" + delBtn("shipments", s.id, "cet envoi") + "</td></tr>";
    }).join("");
    var cRem = d.remittances.filter(function (s) { return ids[s.agent_id]; }).slice(0, 20).map(function (s) {
      return "<tr><td>" + dateFr(s.paid_date) + '</td><td class="txt">' + esc(nameOf[s.agent_id] || "") + "</td><td>" + fmt(s.amount) + "</td><td>" + delBtn("remittances", s.id, "ce versement") + "</td></tr>";
    }).join("");
    var cExp = d.expenses.filter(function (e) { return e.country === country; }).slice(0, 20).map(function (e) {
      return "<tr><td>" + dateFr(e.exp_date) + '</td><td class="txt">' + esc(e.label) + "</td><td>" + fmt(e.amount) + "</td><td>" + delBtn("expenses", e.id, "cette dépense") + "</td></tr>";
    }).join("");

    var lastCost = lsGet(COST_KEY) || "";
    var forms = agents.length ? (
      '<details class="panel fold"><summary>Envoyer du stock à un agent</summary><form data-form="shipment" class="fields" novalidate>' +
      '<div class="field"><label for="f1-agent">Agent</label><select id="f1-agent" name="agent_id">' + agentOptions(agents) + "</select></div>" +
      '<div class="field"><label for="f1-date">Date</label><input id="f1-date" name="date" type="date" value="' + today() + '"></div>' +
      '<div class="field"><label for="f1-qty">Sachets envoyés</label><input id="f1-qty" name="qty" type="number" inputmode="numeric" min="1" step="1" required></div>' +
      '<div class="field"><label for="f1-cost">Coût de revient par sachet (FCFA)</label><input id="f1-cost" name="unit_cost" type="number" inputmode="decimal" min="0" step="any" value="' + esc(lastCost) + '" required><span class="hint">Achat plus transport, divisé par le nombre de sachets. L\'agent ne le voit pas.</span></div>' +
      '<div class="field wide"><button class="primary" type="submit">Enregistrer l\'envoi</button></div></form></details>' +
      '<details class="panel fold"><summary>Enregistrer un versement reçu</summary><form data-form="remittance" class="fields" novalidate>' +
      '<div class="field"><label for="f2-agent">Agent</label><select id="f2-agent" name="agent_id">' + agentOptions(agents) + "</select></div>" +
      '<div class="field"><label for="f2-date">Date</label><input id="f2-date" name="date" type="date" value="' + today() + '"></div>' +
      '<div class="field wide"><label for="f2-amount">Montant reçu (FCFA)</label><input id="f2-amount" name="amount" type="number" inputmode="decimal" min="1" step="any" required></div>' +
      '<div class="field wide"><button class="primary" type="submit">Enregistrer le versement</button></div></form></details>'
    ) : '<section class="panel"><div class="muted">Aucun agent dans ce pays pour le moment.</div></section>';
    var expForm = '<details class="panel fold"><summary>Ajouter une dépense de campagne</summary><form data-form="expense" class="fields" novalidate><input type="hidden" name="country" value="' + esc(country) + '">' +
      '<div class="field"><label for="f3-label">Description</label><input id="f3-label" name="label" type="text" value="TikTok" required></div>' +
      '<div class="field"><label for="f3-date">Date</label><input id="f3-date" name="date" type="date" value="' + today() + '"></div>' +
      '<div class="field wide"><label for="f3-amount">Montant dépensé (FCFA)</label><input id="f3-amount" name="amount" type="number" inputmode="decimal" min="1" step="any" required></div>' +
      '<div class="field wide"><button class="primary" type="submit">Enregistrer la dépense</button></div></form></details>';

    return '<section class="panel result"><div class="bigline"><span class="eyebrow">Bénéfice net · ' + esc(country) + '</span><span class="big ' + cls(t.profit) + '">' + money(t.profit) + '</span><span class="muted small">Ventes − coût des sachets vendus − dépenses de campagnes</span></div>' +
      '<div class="pair">' + statTile("Chiffre d\'affaires", money(t.revenue), fmt(t.sold) + " sachets vendus") + statTile("Reste à recevoir", money(t.toRemit), "Déjà reçu : " + money(t.remitted), t.toRemit > 0 ? "warn" : "pos") + statTile("Stock restant chez l\'agent", fmt(t.remaining) + " sachets", fmt(t.shipped) + " envoyés") + statTile("Dépenses de campagnes", money(t.expenses), "Coût des sachets vendus : " + money(t.cogs)) + "</div></section>" +
      '<section class="panel"><h2>Agents</h2>' + (agentCards ? '<div class="rows">' + agentCards + "</div>" : '<div class="muted small">Aucun agent.</div>') + "</section>" +
      forms + expForm +
      '<section class="panel"><h2>Ventes par jour</h2>' + tableWrap("<th>Jour</th><th>Sachets</th><th>Montant (FCFA)</th>", dayRows || emptyRow(3, "Aucune vente."), "", 0) + "</section>" +
      '<section class="panel"><h2>Dernières ventes saisies</h2>' + tableWrap("<th>Jour</th><th>Agent</th><th>Sachets</th><th>Montant</th><th>Client</th><th></th>", saleRows || emptyRow(6, "Aucune vente."), "", 560) + "</section>" +
      '<section class="panel"><h2>Envois, versements et dépenses</h2><h3>Stock envoyé</h3>' + tableWrap("<th>Jour</th><th>Agent</th><th>Sachets</th><th>Coût/sachet</th><th></th>", cShip || emptyRow(5, "Aucun envoi."), "", 480) +
      "<h3>Versements reçus</h3>" + tableWrap("<th>Jour</th><th>Agent</th><th>Montant</th><th></th>", cRem || emptyRow(4, "Aucun versement."), "", 420) +
      "<h3>Dépenses de campagnes</h3>" + tableWrap("<th>Jour</th><th>Description</th><th>Montant</th><th></th>", cExp || emptyRow(4, "Aucune dépense."), "", 420) + "</section>";
  }

  function ownerAgents(d) {
    var pend = d.profiles.filter(function (p) { return p.role === "pending"; });
    var act = d.profiles.filter(function (p) { return p.role === "agent"; });
    function countrySel(id, cur) {
      return '<select data-country="' + esc(id) + '" aria-label="Pays">' + (cur ? "" : '<option value="">Choisir le pays</option>') + COUNTRIES.map(function (c) { return '<option value="' + esc(c) + '"' + (c === cur ? " selected" : "") + ">" + esc(c) + "</option>"; }).join("") + "</select>";
    }
    var pendHtml = pend.length ? pend.map(function (p) {
      return '<div class="row"><div class="rowtxt"><strong>' + esc(p.name || "") + '</strong><div class="hint">' + esc(p.email || "") + "</div></div>" + countrySel(p.id, "") + '<button type="button" class="primary mini2" data-act="approve" data-id="' + esc(p.id) + '">Valider comme agent</button>' + delBtn("profiles", p.id, "ce compte") + "</div>";
    }).join("") : '<div class="muted small">Aucun compte en attente.</div>';
    var actHtml = act.length ? act.map(function (p) {
      return '<div class="row"><div class="rowtxt"><strong>' + esc(p.name || "") + '</strong><div class="hint">' + esc(p.email || "") + "</div></div>" + countrySel(p.id, p.country) + '<button type="button" class="mini2" data-act="setcountry" data-id="' + esc(p.id) + '">Changer le pays</button><button type="button" class="mini danger" data-act="deactivate" data-id="' + esc(p.id) + '">Désactiver</button></div>';
    }).join("") : '<div class="muted small">Aucun agent validé.</div>';
    return '<section class="panel"><h2>Comptes en attente</h2><div class="hint">Envoie l\'adresse de l\'application à ton agent. Il crée son compte, puis il apparaît ici. Choisis son pays et valide.</div><div class="rows">' + pendHtml + "</div></section>" +
      '<section class="panel"><h2>Agents validés</h2><div class="rows">' + actHtml + "</div></section>";
  }

  function renderOwner() {
    var d = S.data || { profiles: [], shipments: [], sales: [], remittances: [], expenses: [] };
    var t = ownerTabs(d);
    if (t.list.indexOf(S.tab) < 0) S.tab = "total";
    var body = S.tab === "total" ? ownerTotal(d) : S.tab === "agents" ? ownerAgents(d) : ownerCountry(d, S.tab);
    return "<main>" + header() + tabBar(t) + body + "</main>";
  }

  function render(force) {
    var ae = document.activeElement;
    if (!force && ae && $app.contains(ae) && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)) { pendingRender = true; return; }
    pendingRender = false;
    var open = {};
    Array.prototype.forEach.call($app.querySelectorAll("details"), function (el, i) { if (el.open) open[el.querySelector("summary").textContent] = 1; });
    var y = window.pageYOffset;
    var html;
    if (!window.__API__ && window.GS_CONFIG && /REMPLACER/.test(window.GS_CONFIG.SUPABASE_URL + window.GS_CONFIG.SUPABASE_KEY)) {
      html = '<main class="narrow"><section class="panel"><h2>Configuration manquante</h2><p class="muted" style="margin:0">L\'adresse et la clé de la base de données ne sont pas encore renseignées dans le fichier config.js.</p></section></main>';
    } else if (S.loading) html = '<main class="narrow"><div class="muted">Chargement…</div></main>';
    else if (!S.session) html = renderAuth();
    else if (!S.profile) html = '<main class="narrow">' + header() + '<section class="panel"><div class="muted">' + (S.loadError ? esc(S.loadError) : "Chargement du profil…") + "</div></section></main>";
    else if (S.profile.role === "owner") html = renderOwner();
    else if (S.profile.role === "agent") html = renderAgent();
    else html = renderPending();
    $app.innerHTML = html;
    Array.prototype.forEach.call($app.querySelectorAll("details"), function (el) { if (open[el.querySelector("summary").textContent]) el.open = true; });
    window.scrollTo(0, y);
  }

  /* ---------- chargement ---------- */
  function loadProfile() {
    if (!S.session) { S.profile = null; return Promise.resolve(); }
    return api.profile(S.session.user.id).then(function (p) { S.profile = p; S.loadError = ""; }, function (e) { S.loadError = errText(e); });
  }
  function refresh(force) {
    if (!S.session) return Promise.resolve();
    return loadProfile().then(function () {
      if (!S.profile || S.profile.role === "pending") return null;
      return (S.profile.role === "owner" ? api.loadOwner() : api.loadAgent()).then(function (d) { S.data = d; S.loadError = ""; }, function (e) { S.loadError = errText(e); if (force) toast(errText(e), true); });
    }).then(function () {
      var n = new Date(); S.updated = String(n.getHours()).padStart(2, "0") + ":" + String(n.getMinutes()).padStart(2, "0");
      render(force);
      if (S.profile && !liveOn) { liveOn = true; api.subscribe(function () { clearTimeout(refreshTimer); refreshTimer = setTimeout(function () { refresh(false); }, 500); }); }
    });
  }
  function startSession(s) {
    S.session = s; S.profile = null; S.data = null; S.loading = false;
    clearInterval(pollTimer);
    if (!s) { render(true); return; }
    render(true);
    refresh(true);
    pollTimer = setInterval(function () { refresh(false); }, 30000);
  }

  /* ---------- actions ---------- */
  function armDelete(key) {
    S.armed = key; clearTimeout(armTimer);
    armTimer = setTimeout(function () { S.armed = null; render(false); }, 4000);
    render(true);
  }
  function run(promise, okText) {
    S.busy = true;
    return promise.then(function () { S.busy = false; if (okText) toast(okText); return refresh(true); }, function (e) { S.busy = false; toast(errText(e), true); render(true); });
  }

  $app.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]"); if (!b) return;
    var act = b.getAttribute("data-act"), id = b.getAttribute("data-id");
    if (act === "tab") { S.tab = b.getAttribute("data-tab"); lsSet(TAB_KEY, S.tab); render(true); window.scrollTo(0, 0); }
    else if (act === "refresh") { refresh(true).then(function () { toast("Mis à jour."); }); }
    else if (act === "logout") { api.signOut().then(function () { liveOn = false; startSession(null); }); }
    else if (act === "authmode") { S.authMode = S.authMode === "login" ? "signup" : "login"; S.authMsg = ""; S.authOk = ""; render(true); }
    else if (act === "del") {
      var key = b.getAttribute("data-table") + ":" + id;
      if (S.armed !== key) { armDelete(key); return; }
      clearTimeout(armTimer); S.armed = null;
      run(api.remove(b.getAttribute("data-table"), id), "Supprimé.");
    }
    else if (act === "approve" || act === "setcountry") {
      var sel = $app.querySelector('select[data-country="' + id + '"]');
      if (!sel || !sel.value) { toast("Choisis d'abord le pays.", true); return; }
      var patch = act === "approve" ? { role: "agent", country: sel.value } : { country: sel.value };
      run(api.updateProfile(id, patch), act === "approve" ? "Agent validé." : "Pays modifié.");
    }
    else if (act === "deactivate") {
      var key2 = "deact:" + id;
      if (S.armed !== key2) { armDelete(key2); b.textContent = "Confirmer"; return; }
      clearTimeout(armTimer); S.armed = null;
      run(api.updateProfile(id, { role: "pending" }), "Agent désactivé.");
    }
  });

  $app.addEventListener("submit", function (e) {
    var f = e.target.closest("form[data-form]"); if (!f) return;
    e.preventDefault();
    var kind = f.getAttribute("data-form"), fd = new FormData(f);
    function v(k) { return String(fd.get(k) == null ? "" : fd.get(k)).trim(); }
    if (S.busy) return;
    if (kind === "auth") {
      var email = v("email"), pw = v("password"), name = v("name");
      S.authMsg = ""; S.authOk = ""; S.authEmail = email; S.authName = name;
      if (!email || !pw || (S.authMode === "signup" && !name)) { S.authMsg = "Remplis tous les champs."; render(true); return; }
      S.busy = true; render(true);
      var p = S.authMode === "login" ? api.signIn(email, pw) : api.signUp(name, email, pw).then(function (r) { if (!r || !r.session) S.authOk = "Compte créé. Vérifie ton email pour confirmer, puis connecte-toi."; });
      p.then(function () { S.busy = false; if (S.authMode === "signup" && S.authOk) S.authMode = "login"; render(true); }, function (err) { S.busy = false; S.authMsg = errText(err); render(true); });
      return;
    }
    if (kind === "sale") {
      var q = num(v("qty")), a = num(v("amount"));
      if (q < 1 || !isFinite(a) || v("amount") === "") { toast("Indique le nombre de sachets et le montant.", true); return; }
      run(api.insert("sales", { agent_id: S.session.user.id, sale_date: v("date") || today(), qty: Math.round(q), amount: a, place: v("place") || null }), "Vente enregistrée.");
    } else if (kind === "shipment") {
      var sq = num(v("qty")), sc = num(v("unit_cost"));
      if (!v("agent_id") || sq < 1 || v("unit_cost") === "") { toast("Choisis l'agent, le nombre de sachets et le coût.", true); return; }
      lsSet(COST_KEY, v("unit_cost"));
      run(api.insert("shipments", { agent_id: v("agent_id"), ship_date: v("date") || today(), qty: Math.round(sq), unit_cost: sc }), "Envoi enregistré.");
    } else if (kind === "remittance") {
      var ra = num(v("amount"));
      if (!v("agent_id") || ra <= 0) { toast("Choisis l'agent et le montant.", true); return; }
      run(api.insert("remittances", { agent_id: v("agent_id"), paid_date: v("date") || today(), amount: ra }), "Versement enregistré.");
    } else if (kind === "expense") {
      var ea = num(v("amount"));
      if (ea <= 0 || !v("label")) { toast("Indique la description et le montant.", true); return; }
      run(api.insert("expenses", { country: v("country"), exp_date: v("date") || today(), label: v("label"), amount: ea }), "Dépense enregistrée.");
    }
  });

  $app.addEventListener("focusout", function () {
    setTimeout(function () { if (pendingRender) render(false); }, 150);
  });
  document.addEventListener("visibilitychange", function () { if (!document.hidden && S.session) refresh(false); });

  /* ---------- démarrage ---------- */
  window.__GS = { agg: agg, countryStats: countryStats };
  if (window.GS_CONFIG && /REMPLACER/.test(window.GS_CONFIG.SUPABASE_URL + window.GS_CONFIG.SUPABASE_KEY) && !window.__API__) { S.loading = false; render(true); return; }
  if (!api) {
    if (!window.supabase) { S.loading = false; $app.innerHTML = '<main class="narrow"><section class="panel"><h2>Connexion impossible</h2><p class="muted" style="margin:0">Impossible de charger le service. Vérifie ta connexion internet et recharge la page.</p></section></main>'; return; }
    api = makeApi();
  }
  api.onAuth(function (s) { if ((s && s.user && S.session && S.session.user.id === s.user.id) || (!s && !S.session)) { S.session = s; return; } startSession(s); });
  api.session().then(function (s) { if (!S.session) startSession(s); else S.loading = false; }, function () { startSession(null); });
})();
</script>
<script>
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
</script>
<script>
(function () {
  var bar = document.getElementById("installBar"), btn = document.getElementById("installBtn"), msg = document.getElementById("installMsg"), dp = null;
  if (!bar) return;
  var standalone = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone;
  if (standalone) return;
  window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); dp = e; bar.hidden = false; });
  btn.addEventListener("click", function () {
    if (!dp) return;
    dp.prompt();
    var done = function () { dp = null; bar.hidden = true; };
    if (dp.userChoice && dp.userChoice.then) dp.userChoice.then(done, done); else done();
  });
  window.addEventListener("appinstalled", function () { bar.hidden = true; });
  if (/iphone|ipad|ipod/i.test(navigator.userAgent)) {
    msg.textContent = "Pour l'installer : appuie sur le bouton Partager de Safari, puis sur « Sur l'écran d'accueil ».";
    btn.hidden = true; bar.hidden = false;
  }
})();
</script>
</body>
</html>
